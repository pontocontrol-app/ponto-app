/* ---------------- HELPERS ---------------- */
function pad(n){ return n.toString().padStart(2,'0'); }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function brDate(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function brTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function mkDate(dateStr,h,m){ const [y,mo,da]=dateStr.split('-').map(Number); return new Date(y,mo-1,da,h,m); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

const seq = ['entrada','intervalo_inicio','intervalo_retorno','saida'];

function photoThumb(r, sizeClass){

/* ---------------- PERSISTENCE (IndexedDB — dados ficam só neste aparelho) ---------------- */
const IDB_NAME='pontoAppDB', IDB_STORE='kv', IDB_KEY='mainState';
function idbOpen(){ return new Promise((res,rej)=>{
  const r = indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded = ()=>{ r.result.createObjectStore(IDB_STORE); };
  r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
});}
async function idbLoad(){ const dbi = await idbOpen(); return new Promise((res,rej)=>{
  const tx = dbi.transaction(IDB_STORE,'readonly'); const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
  rq.onsuccess = ()=>res(rq.result||null); rq.onerror = ()=>rej(rq.error);
});}
async function idbSave(data){ const dbi = await idbOpen(); return new Promise((res,rej)=>{
  const tx = dbi.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(data, IDB_KEY);
  tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
});}
function persist(){ idbSave(db).catch(err=>console.error('Falha ao salvar dados:', err)); }

async function boot(){
  try{
    const saved = await idbLoad();
    if(saved){ db = saved; }
    else { persist(); }
  }catch(e){ console.error('Não foi possível carregar dados salvos:', e); }
  state.screen = 'home';
  render();
  registerSW();
}

function go(screen, extra){
  stopCamera();
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  render();
}
function emp(id){ return db.employees.find(e=>e.id===id); }
function empRecordsToday(id){ const ds=dstr(new Date()); return db.records.filter(r=>r.employeeId===id && r.date===ds).sort((a,b)=>a.createdAt-b.createdAt); }
function nextTypeFor(id){ const list = empRecordsToday(id); if(list.length===0) return seq[0]; const last=list[list.length-1].type; const i=seq.indexOf(last); return i<seq.length-1? seq[i+1] : null; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = state.screen==='loading' ? `<div class="screen"><div class="center-col">Carregando…</div></div>` : screens[state.screen]();
  if(state.screen==='camera') setupCameraScreen();
}

        if(filled===0) status='<span class="tag-status tag-off">Sem registro</span>';
        else if(filled<4) status='<span class="tag-status tag-warn">Incompleto</span>';
        return `<tr class="${filled>0&&filled<4?'warn-row':''}"><td>${d.split('-').reverse().join('/')}</td>${cells.map(c=>`<td>${c}</td>`).join('')}<td>${status}</td></tr>`;

      <button class="btn" style="margin-top:14px;" onclick="window.print()">IMPRIMIR / SALVAR PDF</button>
    </div>`;
  },

  adminSettings(){
    const c = db.company;
    return `
    <div class="screen">
      <div class="topbar"><button class="backbtn" onclick="go('adminMenu')">${ic.back}</button><span class="row-title">Configurações</span><span></span></div>
      <div style="margin-top:16px; overflow-y:auto;">
        <div class="h2" style="margin-bottom:10px;">Dados da empresa</div>
        <div class="field"><label>Logo da empresa</label>
          <div class="logo-upload-row">
            <div class="logo-preview">${c.logoImage? `<img src="${c.logoImage}"/>` : ic.car}</div>
            <label class="filebtn">${ic.upload} Enviar imagem<input type="file" accept="image/*" onchange="handleLogoUpload(event)"/></label>
            ${c.logoImage? `<button class="btn secondary small" onclick="removeLogo()">Remover</button>`:''}
          </div>
        </div>

        <div class="field"><label>Nome da empresa</label><input id="setName" value="${c.name}"/></div>
        <div class="field"><label>CNPJ</label><input id="setCnpj" value="${c.cnpj}"/></div>
        <div class="field"><label>Endereço (opcional)</label><input id="setAddr" value="${c.address}"/></div>
        <div class="field"><label>Telefone (opcional)</label><input id="setPhone" value="${c.phone}"/></div>
        <div class="field"><label>Senha do administrador</label><input id="setPass" maxlength="4" inputmode="numeric" value="${db.adminPassword}"/></div>
        <button class="btn" onclick="saveSettings()">SALVAR ALTERAÇÕES</button>

        <div class="h2" style="margin:26px 0 10px;">Backup dos dados</div>
        <div class="card" style="margin-bottom:14px;">
          <div class="row-sub" style="margin-bottom:12px;">Os dados ficam salvos apenas neste aparelho. Exporte um backup regularmente para não correr o risco de perdê-los.</div>
          <button class="btn secondary" style="margin-bottom:10px;" onclick="exportBackup()">${ic.download} &nbsp;EXPORTAR BACKUP</button>
          <label class="filebtn" style="width:100%; justify-content:center; box-sizing:border-box;">${ic.upload} Restaurar backup<input type="file" accept="application/json" onchange="importBackupFile(event)"/></label>
        </div>

  },
};

/* ---------------- CAMERA (real) ---------------- */
function setupCameraScreen(){
  if(state.captured || state.cameraError) return;
  const video = document.getElementById('camVideo');
  if(!video) return;
  if(state.stream){ video.srcObject = state.stream; return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.cameraError = 'Este navegador não permite acesso à câmera.'; render(); return;
  }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false })
    .then(stream=>{ state.stream = stream; if(video) video.srcObject = stream; })
    .catch(()=>{ state.cameraError = 'Não foi possível acessar a câmera. Verifique as permissões do navegador para este site.'; render(); });
}
function stopCamera(){ if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream = null; } }
function captureNow(){
  const video = document.getElementById('camVideo');
  if(!video || !video.videoWidth){ return; }
  const w=480, h=360;
  const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext('2d');
  const vw=video.videoWidth, vh=video.videoHeight;
  const scale = Math.max(w/vw, h/vh);
  const sw=w/scale, sh=h/scale, sx=(vw-sw)/2, sy=(vh-sh)/2;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  state.capturedPhoto = canvas.toDataURL('image/jpeg', 0.7);
  state.captured = true;
  stopCamera();
  render();
}
function retakePhoto(){ state.captured=false; state.capturedPhoto=null; render(); }
function simulateCapture(){
  const canvas = document.createElement('canvas'); canvas.width=480; canvas.height=360;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#123a2e'; ctx.fillRect(0,0,480,360);
  ctx.fillStyle = '#33c07a'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
  ctx.fillText('Foto simulada', 240, 185);
  state.capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
  state.captured = true;
  render();
}

/* ---------------- ACTIONS ---------------- */
function selectEmployee(id){ go('pin', {empId:id, pin:''}); }
function pinPress(k){ if(k==='del'){ state.pin=state.pin.slice(0,-1); render(); return; } if(state.pin.length<4){ state.pin+=k; render(); } }
function confirmPin(){
  const e = emp(state.empId);
  if(state.pin === e.pin){ go('nextRecord',{pin:''}); }
  else { alert('PIN incorreto. Tente novamente.'); state.pin=''; render(); }
}
function saveRecord(){
  const now = new Date(); const ds = dstr(now);
  db.records.push({ id: db.nextRecId++, employeeId: state.empId, type: state.pendingType, date: ds, time: brTime(now), createdAt: now.getTime(), photo: state.capturedPhoto });
  persist();
  go('confirm', {captured:false, capturedPhoto:null, pendingType:null});
}
function adminPinPress(k){ if(k==='del'){ state.adminPin=state.adminPin.slice(0,-1); render(); return; } if(state.adminPin.length<4){ state.adminPin+=k; render(); } }
function confirmAdminPin(){
  if(state.adminPin === db.adminPassword){ go('adminMenu',{adminPin:''}); }
  else { alert('Senha incorreta.'); state.adminPin=''; render(); }
}
function toggleEmployee(id){ const e = emp(id); e.active = !e.active; persist(); render(); }
function addEmployee(){
  const name = document.getElementById('newEmpName').value.trim();
  const role = document.getElementById('newEmpRole').value.trim() || 'Funcionário(a)';
  const pin = document.getElementById('newEmpPin').value.trim();
  if(!name || pin.length!==4){ alert('Preencha o nome e um PIN de 4 números.'); return; }
  db.employees.push({ id: db.nextEmpId++, name, role, pin, active:true });
  persist(); render();
}
function openPhotoModal(recId){ state.modal = recId; renderPhotoModal(); }
function renderPhotoModal(){
  const r = db.records.find(x=>x.id===state.modal);
  if(!r) return;
  const e = emp(r.employeeId);
  const hasPhoto = typeof r.photo === 'string' && r.photo.startsWith('data:');
  const div = document.createElement('div');
  div.className='modal-bg'; div.id='photoModal';
  div.innerHTML = `<div class="modal-card">
    <div class="thumb-sq" style="width:100%;height:200px;margin-bottom:14px;">${hasPhoto? `<img src="${r.photo}" style="width:100%;height:100%;object-fit:cover;"/>` : ic.cam}</div>
    <div class="row-title">${e.name}</div>
    <div class="row-sub">${typeLabel[r.type]} · ${r.date.split('-').reverse().join('/')} ${r.time}</div>
    <button class="btn secondary" style="margin-top:14px;" onclick="document.getElementById('photoModal').remove()">FECHAR</button>
  </div>`;
  div.onclick = (ev)=>{ if(ev.target===div) div.remove(); };
  document.body.appendChild(div);
}
function saveCorrection(id){
  const r = db.records.find(x=>x.id===id);
  const newTime = document.getElementById('corrTime').value;
  const reason = document.getElementById('corrReason').value.trim() || 'Não informado';
  if(!r.adjusted) r.adjusted = { originalTime: r.time };
  r.adjusted.reason = reason; r.adjusted.by='Administrador'; r.adjusted.at=Date.now();
  r.time = newTime;
  state.correctionTarget=null;
  persist();
  alert('Registro corrigido com sucesso.');
  render();
}
function generateSheet(){
  const empId = Number(document.getElementById('sheetEmp').value);
  const month = Number(document.getElementById('sheetMonth').value);
  const year = Number(document.getElementById('sheetYear').value);
  const e = emp(empId);
  const daysInMonth = new Date(year, month, 0).getDate();
  let diasTrabalhados=0, diasSemRegistro=0, incompletos=0, totalMin=0;
  const rows=[];
  for(let d=1; d<=daysInMonth; d++){
    const ds = year+'-'+pad(month)+'-'+pad(d);
    const wd = new Date(year, month-1, d).getDay();
    const recs = db.records.filter(r=>r.employeeId===empId && r.date===ds);
    const get = t=> recs.find(r=>r.type===t);
    const ent=get('entrada'), ii=get('intervalo_inicio'), ir=get('intervalo_retorno'), sai=get('saida');
    const filled=[ent,ii,ir,sai].filter(Boolean).length;
    let obs='';
    if(filled===0){ obs = (wd===0||wd===6)? 'Folga' : 'Sem registro'; if(wd!==0&&wd!==6) diasSemRegistro++; }
    else if(filled<4){ obs='Incompleto'; incompletos++; }
    else {
      diasTrabalhados++;
      const toMin = t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
      let worked = (toMin(sai.time)-toMin(ent.time)) - (toMin(ir.time)-toMin(ii.time));
      totalMin += Math.max(worked,0);
    }
    rows.push({ day: pad(d), entrada: ent?ent.time:'—', ii: ii?ii.time:'—', ir: ir?ir.time:'—', saida: sai?sai.time:'—', obs });
  }
  const totalHoras = Math.floor(totalMin/60)+'h '+pad(totalMin%60)+'min';
  go('sheetPreview', { sheetPreview:{ emp:e, month, year, monthName: monthNames[month-1], rows, diasTrabalhados, diasSemRegistro, incompletos, totalHoras } });
}
function handleLogoUpload(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ db.company.logoImage = reader.result; persist(); render(); };
  reader.readAsDataURL(file);
}
function removeLogo(){ db.company.logoImage = null; persist(); render(); }
function saveSettings(){
  db.company.logo = document.getElementById('setLogo').value.trim() || db.company.logo;
  db.company.name = document.getElementById('setName').value.trim() || db.company.name;
  db.company.cnpj = document.getElementById('setCnpj').value.trim();
  db.company.address = document.getElementById('setAddr').value.trim();
  db.company.phone = document.getElementById('setPhone').value.trim();
  const pass = document.getElementById('setPass').value.trim();
  if(pass.length===4) db.adminPassword = pass;
  persist();
  alert('Dados da empresa atualizados.');
  go('adminMenu');
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = 'backup-ponto-'+dstr(new Date())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackupFile(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.employees || !parsed.records){ alert('Arquivo de backup inválido.'); return; }
      db = parsed; persist();
      alert('Backup restaurado com sucesso.');
      go('adminMenu');
    }catch(e){ alert('Não foi possível ler este arquivo.'); }
  };
  reader.readAsText(file);
}

/* ---------------- PWA / SERVICE WORKER ---------------- */
function registerSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* ok em file:// ou sem suporte */ });
  }
}
